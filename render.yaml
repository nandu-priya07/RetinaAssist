services:
  - type: web
    name: retinaassist
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    disk:
      name: retinaassist-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: RETINAASSIST_ENV
        value: production
      - key: RETINAASSIST_DATA_DIR
        value: /var/data
      - key: RETINAASSIST_SECRET_KEY
        generateValue: true
      - key: RETINAASSIST_DEMO_PASSWORD
        sync: false
      - key: RETINAASSIST_ADMIN_PASSWORD
        sync: false
